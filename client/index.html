<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Spendix — Smart Expense & Subscription Tracker</title>
    <meta name="title" content="Spendix — Smart Expense & Subscription Tracker" />
    <meta name="description" content="Track your recurring expenses, manage income streams, and analyze financial cash flow smartly with real-time analytics." />
    <meta name="keywords" content="expense tracker, finance app, subscription manager, budget planner, spendix" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spendix — Smart Expense & Subscription Tracker" />
    <meta property="og:description" content="Track expenses, optimize subscriptions, and analyze your finances in real-time." />
    <meta property="og:image" content="/logo.png" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="theme-color" content="#0D0D15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spendix" />
